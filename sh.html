<h1>login</h1>

<form>

    <div class="input">
        <label>Username</label>
        <input type="text">
    </div>

    <div class="input">
        <label>Password</label>
        <input type="password">
    </div>

    <div class="options">

        <label class="remember">
            <input type="checkbox">
            Remember me
        </label>

        <a href="#" class="forgot">
            Forgot Password?
        </a>

    </div>

    <button class="login" type="submit">
        Login
    </button>

</form>

<div class="register">
    Don't have an account?
    <a href="#">Register</a>
</div>
